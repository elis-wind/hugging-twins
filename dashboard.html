<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hugging Twins · Health Twin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --panel: rgba(15, 23, 42, 0.75);
      --accent: #8ef3c5;
      --accent-2: #5ea0ff;
      --muted: #c7d2fe;
      --text: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;
      background: radial-gradient(circle at 20% 20%, rgba(94,160,255,0.15), transparent 28%), radial-gradient(circle at 80% 0%, rgba(142,243,197,0.18), transparent 32%), #030712;
      color: var(--text);
      min-height: 100vh;
    }
    .app {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 20px 64px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    h1 { margin: 0; font-size: 26px; letter-spacing: -0.02em; }
    .pill {
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.05);
      color: var(--muted);
      font-size: 13px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 16px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.35);
    }
    .panel h2 { margin: 0 0 12px; font-size: 18px; }
    form label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    form input, form select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      margin-bottom: 12px;
      font-family: inherit;
    }
    button {
      padding: 12px 16px;
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      border: none;
      border-radius: 14px;
      color: #0b1224;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 10px 30px rgba(94,160,255,0.25); }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }
    .card {
      padding: 12px;
      border-radius: 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.05);
    }
    .card .label { color: var(--muted); font-size: 12px; }
    .card .value { font-size: 22px; font-weight: 700; margin: 4px 0; }
    .card .sub { color: var(--muted); font-size: 12px; }
    .chart-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin-top: 16px; }
    canvas { width: 100%; height: 240px; }
    .analysis { margin-top: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px,1fr)); gap: 12px; }
    .analysis p { margin: 0; color: var(--muted); line-height: 1.5; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border-radius: 12px;
      background: rgba(255,255,255,0.06);
      color: var(--text);
      font-size: 13px;
    }
    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
      header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Hugging Twins · Personal Health Twin</h1>
        <div id="generatedAt" class="pill">Loading Samsung Health data…</div>
      </div>
      <div class="pill">Step → Sleep → Heart → Stress → Weight</div>
    </header>

    <div class="grid">
      <section class="panel">
        <h2>1 · Your Profile</h2>
        <form id="profile-form">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" placeholder="Alex" />

          <label for="age">Age</label>
          <input id="age" name="age" type="number" min="10" max="100" required />

          <label for="height">Height (cm)</label>
          <input id="height" name="height" type="number" min="120" max="230" required />

          <label for="weight">Weight (kg)</label>
          <input id="weight" name="weight" type="number" min="35" max="200" placeholder="Leave blank to use Samsung scale" />

          <label for="smoking">Smoking</label>
          <select id="smoking" name="smoking">
            <option value="no">No</option>
            <option value="occasionally">Occasionally</option>
            <option value="yes">Yes</option>
          </select>

          <label for="alcohol">Alcohol (drinks/week)</label>
          <input id="alcohol" name="alcohol" type="number" min="0" max="30" value="0" />

          <label for="activity">Exercise days per week</label>
          <input id="activity" name="activity" type="number" min="0" max="14" value="3" />

          <label for="stressSelf">Self-rated stress (1-5)</label>
          <input id="stressSelf" name="stressSelf" type="number" min="1" max="5" value="3" />

          <button type="submit">Run Analysis</button>
        </form>
      </section>

      <section class="panel">
        <h2>2 · Health Snapshot</h2>
        <div class="cards" id="summary-cards"></div>
        <div class="analysis">
          <div>
            <div class="badge" id="current-health">Waiting for data…</div>
            <p id="current-notes"></p>
          </div>
          <div>
            <div class="badge" id="projection">Projection pending…</div>
            <p id="projection-notes"></p>
          </div>
        </div>
      </section>
    </div>

    <!-- Trends section removed per request -->
  </div>

  <script>
    const summaryCards = document.getElementById('summary-cards');
    const generatedAt = document.getElementById('generatedAt');
    const currentHealth = document.getElementById('current-health');
    const currentNotes = document.getElementById('current-notes');
    const projection = document.getElementById('projection');
    const projectionNotes = document.getElementById('projection-notes');

    let healthData = null;
    const charts = {};

    const clamp = (v, min, max) => Math.min(Math.max(v, min), max);

    function formatTrend(perDay, unit) {
      const perWeek = perDay * 7;
      const perMonth = perDay * 30;
      const absWeek = Math.abs(perWeek);
      const absMonth = Math.abs(perMonth);
      if (absWeek >= 0.1) return `${perWeek.toFixed(1)} ${unit} / week`;
      if (absMonth >= 0.1) return `${perMonth.toFixed(2)} ${unit} / month`;
      return `flat (±0.1 ${unit} / month)`;
    }

    const createChart = (ctxId, label, dataPoints, color) => {
      const ctx = document.getElementById(ctxId);
      if (charts[ctxId]) charts[ctxId].destroy();
      charts[ctxId] = new Chart(ctx, {
        type: 'line',
        data: {
          datasets: [{
            label,
            data: dataPoints,
            tension: 0.3,
            borderColor: color,
            backgroundColor: color + '55',
            fill: true,
            pointRadius: 0
          }]
        },
        options: {
          plugins: { legend: { display: false } },
          scales: {
            x: { type: 'time', time: { unit: 'month' }, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#9ca3af' } },
            y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#9ca3af' } }
          }
        }
      });
    };

    const toLine = (series, key) =>
      series.filter(p => p[key] != null).map(p => ({ x: p.date, y: Number(p[key]) }));

    function computeCompositeScores(profile, metrics) {
      const bmi = metrics.bmi || 0;
      const stepsScore = clamp(metrics.stepsAvg / 9000, 0, 1);
      const sleepScore = clamp(metrics.sleepAvg / 7.5, 0, 1.1);
      const hrScore = clamp(80 / (metrics.restingHr || 1), 0, 1.2);
      const stressScore = clamp((100 - metrics.stressAvg) / 100, 0, 1);
      const bmiScore = clamp(1 - Math.abs(bmi - 22) / 10, 0, 1);

      const lifestylePenalty =
        (profile.smoking === 'yes' ? 0.15 : profile.smoking === 'occasionally' ? 0.07 : 0) +
        (profile.activity < 2 ? 0.08 : profile.activity < 4 ? 0.03 : 0) +
        (profile.alcohol > 7 ? 0.05 : 0) +
        (profile.stressSelf >= 4 ? 0.05 : 0);

      const coreScore = (stepsScore + sleepScore + hrScore + stressScore + bmiScore) / 5;
      return clamp(coreScore - lifestylePenalty, 0, 1);
    }

    function computeBioAge(profile) {
      const m = healthData.metrics;
      const weightLatest = profile.weight || m.weight.latest || m.weight.average || 0;
      const heightM = profile.height / 100;
      const bmi = heightM > 0 ? weightLatest / (heightM * heightM) : 0;

      const metrics = {
        stepsAvg: m.steps.average,
        stepsTrend: m.steps.trend_per_day,
        sleepAvg: m.sleep.average,
        sleepTrend: m.sleep.trend_per_day,
        restingHr: m.resting_hr.average,
        hrTrend: m.resting_hr.trend_per_day,
        stressAvg: m.stress.average,
        stressTrend: m.stress.trend_per_day,
        weightTrend: m.weight.trend_per_day,
        bmi,
        weightLatest,
      };

      const composite = computeCompositeScores(profile, metrics);
      const bioAge = profile.age + (0.5 - composite) * 14 + (profile.smoking === 'yes' ? 4 : 0);

      const years = 10;
      const stepTrendYear = metrics.stepsTrend * 365;
      const weightTrendYear = metrics.weightTrend * 365;
      const hrTrendYear = metrics.hrTrend * 365;
      const sleepTrendYear = metrics.sleepTrend * 365;

      const projectionShift =
        -stepTrendYear / 1200 +
        weightTrendYear * 0.5 +
        hrTrendYear * 0.2 +
        -sleepTrendYear * 0.4;

      const projected = bioAge + years * 0.18 + projectionShift;

      return {
        composite: Math.round(composite * 100),
        bioAge: Math.round(bioAge),
        projected: Math.round(projected),
        chronological: profile.age,
        metrics,
      };
    }

    function renderSummary(result, metrics) {
      const cards = [
        { label: 'Biological age', value: `${result.bioAge} yrs`, sub: `Chronological: ${result.chronological} yrs` },
        { label: '10-year projection', value: `${result.projected} yrs`, sub: 'Uses current trend lines' },
        { label: 'Activity', value: `${Math.round(metrics.stepsAvg).toLocaleString()} steps/day`, sub: `Trend: ${formatTrend(metrics.stepsTrend, 'steps')}` },
        { label: 'Sleep', value: `${metrics.sleepAvg.toFixed(1)} h`, sub: `Trend: ${formatTrend(metrics.sleepTrend, 'h')}` },
        { label: 'Resting HR', value: `${metrics.restingHr.toFixed(0)} bpm`, sub: `Trend: ${formatTrend(metrics.hrTrend, 'bpm')}` },
        { label: 'Stress', value: `${metrics.stressAvg.toFixed(0)}/100`, sub: `Trend: ${formatTrend(metrics.stressTrend, 'pts')}` },
        { label: 'BMI', value: metrics.bmi ? metrics.bmi.toFixed(1) : '—', sub: `Weight drift: ${formatTrend(metrics.weightTrend, 'kg')}` },
      ];

      summaryCards.innerHTML = cards.map(card => `
        <div class="card">
          <div class="label">${card.label}</div>
          <div class="value">${card.value}</div>
          <div class="sub">${card.sub}</div>
        </div>
      `).join('');

      currentHealth.textContent = `Current state · ${result.composite}%`;
      currentNotes.textContent = `Higher is better — composite derived from steps, sleep, resting HR, stress and BMI.`;
      projection.textContent = `Projected bio-age in 10 years: ${result.projected} yrs`;
      projectionNotes.textContent = `Projection shifts with new Samsung data; step and sleep trends pull it down, stress and weight drift push it up.`;
    }

    async function loadData() {
      const res = await fetch('./data/health_summary.json');
      healthData = await res.json();
      generatedAt.textContent = `Samsung data processed: ${new Date(healthData.generated_at).toLocaleString()}`;
    }

    document.getElementById('profile-form').addEventListener('submit', (e) => {
      e.preventDefault();
      if (!healthData) return;
      const form = new FormData(e.target);
      const profile = {
        name: form.get('name') || 'You',
        age: Number(form.get('age') || 0),
        height: Number(form.get('height') || 0),
        weight: Number(form.get('weight')) || null,
        smoking: form.get('smoking'),
        alcohol: Number(form.get('alcohol') || 0),
        activity: Number(form.get('activity') || 0),
        stressSelf: Number(form.get('stressSelf') || 3),
      };
      const result = computeBioAge(profile);
      renderSummary(result, result.metrics);
    });

    loadData().catch(() => {
      generatedAt.textContent = 'Could not load data/health_summary.json — run `python health_dashboard.py` first.';
    });
  </script>
</body>
</html>
